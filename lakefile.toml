name = "lean_proofs"
version = "14.0.0"
keywords = ["math"]
# Default builds stay on Mathlib-free custody/release surfaces. The root
# `LeanProofs` aggregate remains buildable explicitly; it intentionally imports
# paper/specimen modules that can reach Mathlib.
defaultTargets = [
  "AdmissibilityCalculus",
  "AdmissibilityKernels",
  "AdmissibilityEvidence",
  "DynamicTrace",
  "GovernedTransport",
  "GovernedTransportEvidence",
  "SafetyBridge",
  "PathVerdict",
  "PathVerdictEvidence",
  "Witnessed",
  "WitnessedEvidence",
  "PaidRecompositionEvidence",
  "BoundedCalculi",
  "CustodyIndexed",
  "CustodyIndexedEvidence",
  "ProofTheory",
  "ProofTheoryEvidence",
  "ViewSemantics",
  "ViewSemanticsEvidence",
  "ReachableDrift",
  "JudgmentOrientation",
  "JudgmentOrientationEvidence",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "6ef8cc2731780be866bf243afcb7732f4da5f406"  # pinned to lake-manifest.json SHA; move only via explicit `lake update` + repin (scripts/check-mathlib-pin.sh)

[[lean_lib]]
name = "LeanProofs"
roots = ["LeanProofs"]

# Temporary, non-default source library for the exact public Continuity
# admission rename gate.
[[lean_lib]]
name = "V15ContinuityAdmission"
srcDir = "formalization"
roots = ["Continuity.Admission"]

# Temporary, non-default v15 transfer gate. These roots remain isolated from
# every stable/public aggregate pending separate operator ratification.
[[lean_lib]]
name = "V15PublicTransfer"
srcDir = "formalization"
roots = [
  "Continuity.Admission.Qualification",
  "StaticRole",
  "PJ",
  "Continuity.Admission.Qualification.Campaign",
  "PJ.Campaign.TrancheAQualification",
  "PJ.Campaign.TrancheBPrimeQualification",
  "PJ.Campaign.TrancheCPrimeQualification",
  "PJ.Campaign.TrancheDPrimeQualification",
  "scripts.PJTrancheADeclarationDump",
  "scripts.PJTrancheBPrimeDeclarationDump",
  "scripts.PJTrancheCPrimeDeclarationDump",
  "scripts.PJTrancheDPrimeDeclarationDump",
  "scripts.ContinuityAdmissionDeclarationDump",
]

# Exact compatibility-bearing Admissibility Kernels root.
[[lean_lib]]
name = "AdmissibilityKernels"
srcDir = "."
roots = ["LeanProofs.Admissibility.AdmissibilityKernels"]

# Mathlib-free terminal public evidence over the admissibility families.
[[lean_lib]]
name = "AdmissibilityEvidence"
srcDir = "."
roots = [
  "LeanProofs.Admissibility.CorrectiveBoundary",
  "LeanProofs.Admissibility.PublicReceiptRefinement",
  "LeanProofs.Admissibility.RecoveryMargin",
  "LeanProofs.Admissibility.ClosureEligibility",
  "LeanProofs.Admissibility.DeferredWitness",
  "LeanProofs.Admissibility.FiatAdmissibility",
  "LeanProofs.Admissibility.NumericalAdmissibility",
  "LeanProofs.Admissibility.AxisSkew",
  "LeanProofs.Admissibility.PredicateWitnessSeparation",
  "LeanProofs.Admissibility.AuthorityScope",
  "LeanProofs.Admissibility.AuthorizedNotSafe",
  "LeanProofs.Admissibility.AuthorizedNotSafeWitness",
  "LeanProofs.Admissibility.SafetyBridgeWitness",
  "LeanProofs.Admissibility.AuthorizedStepNotSafe",
  "LeanProofs.Admissibility.AuthorizedStepNotSafeWitness",
  "LeanProofs.Admissibility.SafetyTrajectory",
  "LeanProofs.Admissibility.AttestationLedger",
  "LeanProofs.Admissibility.ConsolidationDenial",
  "LeanProofs.Admissibility.Examples",
  "LeanProofs.Admissibility.ActorTraceSpecimen",
  "LeanProofs.Admissibility.AmendmentFragment",
  "LeanProofs.Admissibility.BridgeCustomsSpecimen",
  "LeanProofs.Admissibility.BudgetMerge",
  "LeanProofs.Admissibility.ConsequencePartition",
  "LeanProofs.Admissibility.ContractionHinge",
  "LeanProofs.Admissibility.CustodyFreshnessSpecimen",
  "LeanProofs.Admissibility.MergeConflict",
  "LeanProofs.Admissibility.NoFreeStandingBridge",
  "LeanProofs.Admissibility.ProjectionLaundering",
  "LeanProofs.Admissibility.RRPProfileSpecimen",
  "LeanProofs.Admissibility.ReachabilityClosure",
  "LeanProofs.Admissibility.RetroactiveLegitimation",
  "LeanProofs.Admissibility.ScopedCertification",
  "LeanProofs.Admissibility.SpendabilitySpecimen",
  "LeanProofs.Admissibility.StaleEvidenceMerge",
  "LeanProofs.Admissibility.StandingProfileSpecimen",
  "LeanProofs.Admissibility.TemporalBasis",
  "LeanProofs.Admissibility.WLPAppendAckSpecimen",
  "LeanProofs.Admissibility.WitnessedReachability",
]

# Explicit heavy public-evidence island.
[[lean_lib]]
name = "AdmissibilityEvidenceMathlib"
srcDir = "."
roots = [
  "LeanProofs.Admissibility.CrossBoundaryExposure",
  "LeanProofs.Admissibility.CrossBoundaryDegradation",
  "LeanProofs.Admissibility.CrossBoundaryFailureMint",
  "LeanProofs.Admissibility.CrossBoundaryCascade",
  "LeanProofs.Admissibility.Composition",
]

[[lean_lib]]
name = "DynamicTrace"
srcDir = "."
roots = [
  "LeanProofs.Admissibility.DynamicTrace",
  "LeanProofs.Admissibility.FreshnessDynamicTrace",
]

# Exact GT-4A public stable/evidence split. The stable root imports only the
# ten authorized generic leaves; hostile countermodels remain separately
# default-built public evidence.
[[lean_lib]]
name = "GovernedTransport"
srcDir = "."
roots = ["LeanProofs.GovernedTransport"]

[[lean_lib]]
name = "GovernedTransportEvidence"
srcDir = "."
roots = ["LeanProofs.GovernedTransportEvidence"]

[[lean_lib]]
name = "SafetyBridge"
srcDir = "."
roots = ["LeanProofs.Admissibility.SafetyBridge"]

[[lean_lib]]
name = "AdmissibilityCalculus"
# Calculus stable surface: the governed-family signature, its instances,
# the exact refusal-packet spine, the indexed comparison framework, the
# stored-decision crossing, and the origin/history-bound BreakGlass
# terminal instance (rungs 2-7, Mathlib-free).
roots = ["LeanProofs.Admissibility.Calculus"]

[[lean_lib]]
name = "PathVerdict"
srcDir = "."
roots = ["LeanProofs.Admissibility.PathVerdict"]

[[lean_lib]]
name = "PathVerdictEvidence"
srcDir = "."
roots = ["LeanProofs.Admissibility.PathVerdict.Evidence"]

# A1 (signed 2026-06-26): the Witnessed Derivation Calculus, ported from the
# ratified experiment surface (experiments/no_free_lift_wiring, artifact 5eb5629).
# Mathlib-FREE by construction. Its own lean_lib makes the no-Mathlib property
# build-graph enforced and keeps evidence modules out of `lake build Witnessed`.
# Exact globs are intentional: a recursive `LeanProofs.Witnessed.+` glob would
# absorb PaidRecomposition applications/countermodels into the stable target.
[[lean_lib]]
name = "Witnessed"
srcDir = "."
roots = ["LeanProofs.Witnessed"]

[[lean_lib]]
name = "WitnessedEvidence"
srcDir = "."
roots = ["LeanProofs.Witnessed.Evidence"]

# V11 terminal evidence. These focused roots are default-built for regression
# coverage but remain outside the stable `Witnessed` library graph.
[[lean_lib]]
name = "PaidRecompositionEvidence"
srcDir = "."
roots = [
  "LeanProofs.Witnessed.PaidRecomposition.Applications.ResourceTraceOneCrossing",
  "LeanProofs.Witnessed.PaidRecomposition.Countermodels.EndpointCompleteness",
  "LeanProofs.Witnessed.PaidRecomposition.Applications.FiniteSupportOneCrossing",
]

# v3.0.0 (2026-07-01): the Bounded Lifecycle Calculi public-evidence family.
# Its own default target keeps every finished calculus and support module under
# regression coverage without making the family a stable compatibility root.
[[lean_lib]]
name = "BoundedCalculi"
srcDir = "."
roots = ["LeanProofs.BoundedCalculi"]

# Corrected public stable root for the v4-v7 custody-indexed family.
[[lean_lib]]
name = "CustodyIndexed"
srcDir = "."
roots = ["LeanProofs.CustodyIndexed"]

[[lean_lib]]
name = "CustodyIndexedEvidence"
srcDir = "."
roots = ["LeanProofs.CustodyIndexed.Evidence"]

# 2026-07-06: the public proof-theory island (sequent-calculus specimens). Its own
# lean_lib so the no-Mathlib property is build-graph ENFORCED, same rule as
# Witnessed: `lake build ProofTheory` cannot reach Mathlib, and every
# receipt's axiom footprint stays at core Lean (<= propext, Quot.sound) and
# re-attestable in isolation. It is stable as a specimen/library, NOT as
# doctrine: no governance kernel imports these modules, and none may (the
# "admissibility" here is
# literal Gentzen admissibility, the referent the governance vocabulary
# borrows from; rhyme acknowledged, composition refused).
[[lean_lib]]
name = "ProofTheory"
srcDir = "."
roots = ["LeanProofs.ProofTheory"]

[[lean_lib]]
name = "ProofTheoryEvidence"
srcDir = "."
roots = ["LeanProofs.ProofTheory.Evidence"]

# v10 stable ViewSemantics target. The exact root excludes terminal examples,
# countermodels, and application evidence.
[[lean_lib]]
name = "ViewSemantics"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics",
]

# Explicit Mathlib-reaching adapter island for v10. P25's
# matrix semantics stays out of the cheap/default `ViewSemantics` import graph.
[[lean_lib]]
name = "ViewSemanticsEvidenceMathlib"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics.EvidenceMathlib",
]

# Exact Mathlib-free terminal-evidence root.
[[lean_lib]]
name = "ViewSemanticsEvidence"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics.Evidence",
]

[[lean_lib]]
name = "ReachableDrift"
srcDir = "."
roots = ["LeanProofs.ReachableDrift"]

# Stable exact-origin judgment-orientation family. The root imports exactly
# the five promoted theorem modules and excludes terminal example evidence.
[[lean_lib]]
name = "JudgmentOrientation"
srcDir = "."
roots = ["LeanProofs.JudgmentOrientation"]

# Explicit examples/countermodels target. Default build coverage is not stable
# import membership; `LeanProofs.JudgmentOrientation` does not import it.
[[lean_lib]]
name = "JudgmentOrientationEvidence"
srcDir = "."
roots = ["LeanProofs.JudgmentOrientation.Examples"]
