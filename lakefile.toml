name = "lean_proofs"
version = "9.0.0"
keywords = ["math"]
# Default builds stay on Mathlib-free custody/release surfaces. The root
# `LeanProofs` aggregate remains buildable explicitly; it intentionally imports
# paper/specimen modules that can reach Mathlib.
defaultTargets = ["AdmissibilityCustodyAnnex", "Witnessed", "BoundedCalculi", "CustodyIndexedSequents", "ProofTheory", "ViewSemantics", "ViewSemanticsApplications"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "6ef8cc2731780be866bf243afcb7732f4da5f406"  # pinned to lake-manifest.json SHA; move only via explicit `lake update` + repin (scripts/check-mathlib-pin.sh)

[[lean_lib]]
name = "LeanProofs"

# Mathlib-free admissibility custody coverage: public kernels plus the ANNEX
# modules that do not cross into the Finset-backed cross-boundary/composition
# island. This is the cheap target for custody ANNEX regression checks.
[[lean_lib]]
name = "AdmissibilityCustodyAnnex"
srcDir = "."
roots = [
  "LeanProofs.Admissibility.AdmissibilityKernels",
  "LeanProofs.Admissibility.CorrectiveBoundary",
  "LeanProofs.Admissibility.PublicReceiptRefinement",
  "LeanProofs.Admissibility.RecoveryMargin",
  "LeanProofs.Admissibility.ClosureEligibility",
  "LeanProofs.Admissibility.DeferredWitness",
  "LeanProofs.Admissibility.FiatAdmissibility",
  "LeanProofs.Admissibility.NumericalAdmissibility",
  "LeanProofs.Admissibility.AxisSkew",
  "LeanProofs.Admissibility.PredicateWitnessSeparation",
  "LeanProofs.Admissibility.AuthorityScope",
  "LeanProofs.Admissibility.DynamicTrace",
  "LeanProofs.Admissibility.FreshnessDynamicTrace",
  "LeanProofs.Admissibility.AuthorizedNotSafe",
  "LeanProofs.Admissibility.AuthorizedNotSafeWitness",
  "LeanProofs.Admissibility.SafetyBridge",
  "LeanProofs.Admissibility.SafetyBridgeWitness",
  "LeanProofs.Admissibility.AuthorizedStepNotSafe",
  "LeanProofs.Admissibility.AuthorizedStepNotSafeWitness",
  "LeanProofs.Admissibility.SafetyTrajectory",
  "LeanProofs.Admissibility.AttestationLedger",
  "LeanProofs.Admissibility.ConsolidationDenial",
  "LeanProofs.Admissibility.RefusalPropagation",
  "LeanProofs.Admissibility.Examples",
]

# Explicit heavy admissibility island. These modules are still ANNEX, but they
# depend on Mathlib through Finset-backed cross-boundary specimens and are not
# part of the cheap custody target above.
[[lean_lib]]
name = "AdmissibilityMathlibIslands"
srcDir = "."
roots = [
  "LeanProofs.Admissibility.CrossBoundaryExposure",
  "LeanProofs.Admissibility.CrossBoundaryDegradation",
  "LeanProofs.Admissibility.CrossBoundaryFailureMint",
  "LeanProofs.Admissibility.CrossBoundaryCascade",
  "LeanProofs.Admissibility.Composition",
  "LeanProofs.Admissibility.LocalBoundary",
]

# A1 (signed 2026-06-26): the Witnessed Derivation Calculus, ported from the
# ratified experiment surface (experiments/no_free_lift_wiring, artifact 5eb5629).
# Mathlib-FREE by construction — no module under LeanProofs/Witnessed/ may
# `import Mathlib`. Its own lean_lib so the no-Mathlib property is build-graph
# ENFORCED (`lake build Witnessed` cannot reach Mathlib) and the axiom footprint
# stays re-attestable in isolation (gate 5). The LeanProofs lib uses default globs
# and owns only its root module, so LeanProofs.Witnessed.* is import-reachable from
# it but glob-owned only here — no double ownership.
[[lean_lib]]
name = "Witnessed"
srcDir = "."
roots = ["LeanProofs.Witnessed"]
globs = ["LeanProofs.Witnessed", "LeanProofs.Witnessed.+"]

# v3.0.0 (2026-07-01): the Bounded Lifecycle Calculi release surface. Its own
# lean_lib + default target so `lake build` / CI covers the ANNEX family —
# previously nothing globbed it (the LeanProofs lib owns only its root module,
# which deliberately does not import BoundedCalculi), so the release surface
# was invisible to the default build. Build coverage is NOT promotion: the
# LeanProofs.lean import boundary is unchanged and the aggregate stays a
# compile marker. Scratch/ remains uncovered by design (compile-is-contact,
# checked per-file by the campaign loop, not by CI).
[[lean_lib]]
name = "BoundedCalculi"
srcDir = "."
roots = ["LeanProofs.BoundedCalculi"]
globs = ["LeanProofs.BoundedCalculi", "LeanProofs.BoundedCalculi.+"]

# v4.0.0 (2026-07-01): the Custody-Indexed Sequents campaign modules. Build
# coverage for the v4 release object (the v3 lesson: a release headline must
# not be CI-invisible). The files remain Custody-Class: SCRATCH -- build
# coverage is NOT promotion; these are fenced sequent-discipline modules, not
# promoted kernel authority, and LeanProofs.lean does not import them.
[[lean_lib]]
name = "CustodyIndexedSequents"
srcDir = "."
roots = [
  "LeanProofs.Scratch.BridgeSequent",
  "LeanProofs.Scratch.ExecutionSequent",
  "LeanProofs.Scratch.ExecutionObligationSequent",
  "LeanProofs.Scratch.BridgeCompositionSequent",
  "LeanProofs.Scratch.CustodyIndexedSequent",
  "LeanProofs.Scratch.StructuralPolicySequent",
  "LeanProofs.Scratch.EvidenceCalculusSequent",
  # post-v4 cluster (F1-F3) + zoo (C1) -- same CI-coverage rule
  "LeanProofs.Scratch.DeltaTSequent",
  "LeanProofs.Scratch.FluencySequent",
  "LeanProofs.Scratch.CaveatSequent",
  "LeanProofs.Scratch.Zoo",
  "LeanProofs.Scratch.DecidableScreens",
  "LeanProofs.Scratch.DerivationData",
  "LeanProofs.Scratch.StructuralNormalization",
  "LeanProofs.Scratch.LinearNormalization",
  "LeanProofs.Scratch.OccurrenceTrace",
  # post-v5 C3 audit runs -- same CI-coverage rule
  "LeanProofs.Scratch.OverlapAudits",
  # v6 executable custody checking
  "LeanProofs.Scratch.TracedCoherence",
  "LeanProofs.Scratch.FiniteSupportChecker",
  # v7 artifact authority profiles
  "LeanProofs.Scratch.ArtifactProfiles",
  "LeanProofs.Scratch.ProfileStages",
  "LeanProofs.Scratch.JurisdictionScreen",
  # post-v7: tier-1 extraction from private skunkworks
  "LeanProofs.Scratch.PathVerdict.Core",
  "LeanProofs.Scratch.PathVerdict.Edges",
  "LeanProofs.Scratch.PathVerdict.StandardObstructions",
  "LeanProofs.Scratch.PathVerdict.EvidencePromotionCoverage",
]

# 2026-07-06: the proof-theory island (sequent-calculus specimens). Its own
# lean_lib so the no-Mathlib property is build-graph ENFORCED, same rule as
# Witnessed: `lake build ProofTheory` cannot reach Mathlib, and every
# receipt's axiom footprint stays at core Lean (<= propext, Quot.sound) and
# re-attestable in isolation. Custody-Class of the modules is
# UNRATIFIED-CANDIDATE: specimen/library, NOT doctrine -- no governance
# kernel imports these modules, and none may (the "admissibility" here is
# literal Gentzen admissibility, the referent the governance vocabulary
# borrows from; rhyme acknowledged, composition refused).
[[lean_lib]]
name = "ProofTheory"
srcDir = "."
roots = ["LeanProofs.ProofTheory"]
globs = ["LeanProofs.ProofTheory", "LeanProofs.ProofTheory.+"]

# Candidate v10 campaign target. Coverage keeps the in-progress semantics in
# contact with CI; it does not declare a release or promote a custody class.
[[lean_lib]]
name = "ViewSemantics"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics",
]

# Explicit Mathlib-reaching adapter island for the candidate campaign.  P25's
# matrix semantics stays out of the cheap/default `ViewSemantics` import graph.
[[lean_lib]]
name = "ViewSemanticsMathlibIslands"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics.P25Adapter",
]

# Separate non-XOR application/annex root.  The imported source specimen keeps
# SCRATCH custody; explicit build ownership and reachability are not promotion.
[[lean_lib]]
name = "ViewSemanticsApplications"
srcDir = "."
roots = [
  "LeanProofs.ViewSemantics.Applications",
  "LeanProofs.Scratch.BindingSourceAblation",
]
