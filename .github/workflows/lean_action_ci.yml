name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # fetch-depth: 0 — the v15 gates verify ancestry and diffs against the
      # ratified transfer (d1e2d18) and integration (1f0e020) commits, which a
      # shallow clone does not contain.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
      # Full-aggregate gate (v9): the 2026-07-08 import-surface split removed the
      # root `LeanProofs` aggregate from the default targets, so a bare
      # `lake build` (what lean-action runs) no longer covers the Mathlib-reaching
      # paper/specimen modules or the Finset-backed cross-boundary island.
      # "CI green" must mean "release claim green" — build both explicitly.
      - name: Full aggregate + Mathlib islands
        run: lake build LeanProofs AdmissibilityEvidenceMathlib ViewSemanticsEvidenceMathlib
      # v10 stable surface plus terminal public evidence and explicit island.
      - name: View Semantics public surfaces
        run: lake build ViewSemantics ViewSemanticsEvidence ViewSemanticsEvidenceMathlib
      - name: View Semantics footprint gate
        run: bash scripts/check-viewsemantics-footprint.sh
      # V16 candidate: isolated public-evidence core, bounded evidence, exact
      # crossing custody, and compiler-replayed theorem footprints. This is
      # regression coverage only; it creates no stable surface, release, or
      # V16 finality.
      - name: Governed transition boundaries public candidate
        run: |
          lake build GovernedTransitionBoundaries GovernedTransitionBoundariesEvidence
          bash scripts/check-governed-transition-boundaries-crossing.sh
          bash scripts/check-governed-transition-boundaries-footprint.sh
      # Gate 5: re-attest the Witnessed Derivation Calculus axiom footprint in the
      # canonical build context. Fail-closed; protects the now-public Mathlib-free
      # surface against axiom drift / sorry. Runs after lean-action so elan/lake are
      # on PATH. Cheap — the Witnessed lib is Mathlib-free.
      - name: Witnessed footprint gate
        run: bash scripts/check-witnessed-footprint.sh
      # v11: occurrence-exact paid recomposition. Re-attest exact custody,
      # stable-root isolation, terminal evidence, frozen API names, and footprints.
      - name: Paid recomposition footprint gate
        run: bash scripts/check-paid-recomposition-footprint.sh
      # Judgment orientation (v12 stable-surface regression gate): re-attest
      # the five-module family's axiom footprint and receipt names; public evidence
      # builds but stays outside the stable root (import custody is enforced by the
      # custody registry script below).
      - name: Judgment orientation footprint gate
        run: bash scripts/check-judgment-orientation-footprint.sh
      # PathVerdict rung 1 (Admissibility Calculus promotion campaign,
      # 2026-07-17): re-attest the frozen Domains/Located 36-receipt axiom
      # footprint of the extended path-verdict stable root.
      - name: PathVerdict footprint gate
        run: bash scripts/check-pathverdict-footprint.sh
      # Admissibility Calculus stable root (rungs 2-7 of the promotion
      # campaign): re-attest the frozen 191-receipt axiom footprint —
      # signature core, the instances, exact spine, comparison framework,
      # stored-decision crossing, and the BreakGlass terminal instance.
      - name: Calculus footprint gate
        run: bash scripts/check-calculus-footprint.sh
      # Terminal public-evidence fixture: a separate Lake project whose
      # committed manifest resolves the released v2.0.0 Git dependency to an
      # exact commit. A bare build is the downstream compatibility receipt.
      - name: Pinned WDC v2 downstream consumer
        working-directory: downstream/wdc-v2-consumer
        run: lake build
      # Repo audit gates (cheap, grep/toml-based; no Lean invocation):
      # axiom classification, native_decide policy, custody-class registry,
      # Mathlib pin agreement, and the Mathlib-free import closure of the
      # whole public tree and every declared Mathlib-free target.
      - name: Audit scripts
        run: |
          bash scripts/audit-axioms.sh
          bash scripts/audit-native-decide.sh
          bash scripts/check-custody-classes.sh
          bash scripts/check-mathlib-pin.sh
          bash scripts/check-mathlib-free-targets.sh
          bash scripts/check-viewsemantics-isolation.sh
      # v15 release gate: "CI green" must mean "v15 claim green," so build
      # both v15 targets and run the public qualification checker —
      # integration pins, rename equality, PJ declaration manifests, claim
      # strings, changed-path allowlist, and the declaration footprint. The
      # private Track A re-attestation self-reports as skipped on runners
      # (the freeze pins are committed in the checker); everything else
      # fails closed.
      - name: V15 public surfaces
        run: lake build V15Integration V15IntegrationQualification
      - name: V15 public qualification gate
        run: python3 scripts/check-v15-public-qualification.py
